[package]
name = "telesram-rs"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png", "devtools"] }
serde_json = "=1.0.151"
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-opener = "=2.5.5"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "NSError", "NSData", "NSDictionary", "NSKeyValueObserving"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKContentRuleList", "WKContentRuleListStore", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSDockTile", "NSImage"] }
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
url = "=2.5.8"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
strip = true
